<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hesabat</title>
<style>
  :root {
    --bg: #F4F6F8; --card: #FFFFFF; --text: #14202B; --muted: #6B7785; --line: #E3E8ED;
    --brand: #0F766E; --brand-2: #115E59; --brand-soft: #E6F4F2;
    --debt: #C2410C; --debt-soft: #FFF1EA; --pay: #15803D; --pay-soft: #EAF7EE;
    --exp: #7C3AED; --exp-soft: #F3EEFE;
  }
  :root[data-theme="dark"] {
    --bg: #0E1418; --card: #172128; --text: #E6EDF2; --muted: #93A1AD; --line: #27333C;
    --brand: #0D5F59; --brand-2: #0B4E49; --brand-soft: #123532;
    --debt: #F97316; --debt-soft: #3A2116; --pay: #22C55E; --pay-soft: #13301F;
    --exp: #A78BFA; --exp-soft: #2A2142;
  }
  :root[data-theme="dark"] .shade { background: rgba(0,0,0,.6); }
  :root[data-theme="dark"] nav button.on, :root[data-theme="dark"] .avatar, :root[data-theme="dark"] .mini { color: #5EEAD4; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, Roboto, sans-serif; overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--text); }
  .num { font-variant-numeric: tabular-nums; }

  header { background: var(--brand); color: #fff; padding: 14px 16px 18px; }
  header h1 { margin: 0 0 12px; font-size: 20px; font-weight: 650; letter-spacing: .2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: rgba(255,255,255,.12); border-radius: 12px; padding: 10px 12px; }
  .stat small { display: block; opacity: .85; font-size: 12px; }
  .stat b { font-size: 19px; font-weight: 650; }
  button.stat { display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; }

  main { padding: 12px 16px 140px; }
  .search { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 12px; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .row:last-child { border-bottom: 0; }
  .row:active { background: var(--bg); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .grow .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt { font-weight: 650; text-align: right; white-space: nowrap; }
  .amt small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .debt { color: var(--debt); } .pay { color: var(--pay); } .exp { color: var(--exp); } .zero { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 18px 4px 8px; font-weight: 600; }

  .fabp { position: fixed; right: 18px; bottom: 80px; width: 60px; height: 60px; border-radius: 50%; z-index: 5; color: #fff;
    background: linear-gradient(145deg, #14B8A6, var(--brand) 55%, var(--brand-2)); display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(15,118,110,.38), 0 2px 5px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .12s ease; }
  .fabp:active { transform: scale(.92); }
  .fabp svg { width: 30px; height: 30px; }
  .addlist { display: grid; gap: 10px; }
  .addopt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  .addopt:active { background: var(--brand-soft); }
  .addopt .addic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; }
  .addopt .addic svg { width: 24px; height: 24px; }
  .addopt b { display: block; font-size: 16px; }
  .addopt small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .addopt .chev { color: var(--muted); font-size: 22px; line-height: 1; }
  .fab { position: fixed; right: 16px; bottom: 76px; background: var(--brand); color: #fff; border-radius: 22px; padding: 9px 16px; font-size: 14px; font-weight: 650; box-shadow: 0 4px 12px rgba(15,118,110,.3); z-index: 5; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; background: var(--card); border-top: 1px solid var(--line); }
  nav button { flex: 1; padding: 10px 0 12px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button svg { width: 22px; height: 22px; }
  nav button.on { color: var(--brand); font-weight: 650; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .kv:last-child { border-bottom: 0; }
  .kv.total { font-weight: 700; font-size: 17px; }
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .monthbar b { font-size: 17px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 18px; }

  .btn { display: block; width: 100%; padding: 13px; border-radius: 12px; font-weight: 650; text-align: center; margin-top: 10px; }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.ghost { background: var(--card); border: 1px solid var(--line); }
  .btn.danger { background: var(--debt-soft); color: var(--debt); }
  .btn.debtb { background: var(--debt); color: #fff; }
  .btn.payb { background: var(--pay); color: #fff; }
  .btn.expb { background: var(--exp); color: #fff; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two .btn { margin-top: 0; }
  .note { font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: var(--pay-soft); color: var(--pay); }

  /* full-screen page & sheets */
  .page { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10; padding-bottom: 30px; }
  .page header { display: flex; align-items: center; gap: 10px; padding-bottom: 16px; }
  .page header h1 { margin: 0; flex: 1; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page header button { color: #fff; font-size: 22px; width: 36px; height: 36px; border-radius: 10px; }
  .bal { text-align: center; padding: 6px 0 2px; }
  .bal small { opacity: .85; }
  .bal b { display: block; font-size: 32px; }
  .shade { position: fixed; inset: 0; background: rgba(10,20,30,.45); z-index: 20; display: flex; align-items: flex-end; }
  .sheet { background: var(--card); width: 100%; border-radius: 18px 18px 0 0; padding: 18px 16px 22px; max-height: 92vh; overflow-y: auto; }
  .sheet h2 { margin: 0 0 14px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .field { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color-scheme: light dark; }
  .field.big { font-size: 24px; font-weight: 650; }
  .field:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .seg { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; padding: 9px; border-radius: 9px; font-weight: 600; color: var(--muted); }
  .seg button.on.debt { background: var(--debt); color: #fff; }
  .seg button.on.pay { background: var(--pay); color: #fff; }
  .del { color: var(--muted); font-size: 18px; width: 32px; height: 32px; border-radius: 8px; flex: none; }
  .dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 14px 4px 6px; font-size: 13px; color: var(--muted); }
  .dayhead b { color: var(--text); font-weight: 600; }
  .dayhead .num span { margin-left: 8px; font-weight: 650; }
  .hrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .hrow h1 { margin: 0; }
  .hinc { flex: 1; min-width: 0; text-align: center; color: #fff; line-height: 1.15; }
  .hinc small { display: block; font-size: 12px; opacity: .8; }
  .hinc b { display: block; font-size: 19px; margin-top: 5px; }
  .hbtn { position: relative; color: #fff; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.12); }
  .hbtn span { position: absolute; top: -4px; right: -4px; background: var(--debt); color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
  .mini { flex: none; padding: 7px 12px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-weight: 650; font-size: 13px; }
  [data-hold] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  [data-hold] { background: var(--card); position: relative; z-index: 1; touch-action: pan-y; }
  .list { position: relative; }
  .swipe-bg { position: absolute; left: 0; right: 0; background: #F59E0B; color: #fff; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding-right: 20px; font-weight: 700; z-index: 0; transition: background .15s; }
  .swipe-bg.far { background: var(--debt); }
  .more summary { font-weight: 650; cursor: pointer; }
  .pinpage { position: fixed; inset: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; z-index: 50; text-align: center; }
  .pinpage .logo { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .pinpage h1 { margin: 16px 0 2px; font-size: 24px; }
  .pinpage h2 { margin: 0 0 6px; font-size: 15px; font-weight: 500; color: var(--muted); }
  .pinpage .seg { background: var(--card); border: 1px solid var(--line); }
  .pinpage .seg button { color: var(--text); }
  .pinpage .seg button.on.pay { background: var(--brand); color: #fff; }
  .dots { display: flex; gap: 14px; justify-content: center; margin: 20px 0 6px; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--brand); }
  .dots i.on { background: var(--brand); }
  /* smooth entry: a page slides in from the right, a tab fades up, a sheet rises from the bottom */
  @keyframes pageIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes tabIn { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shadeIn { from { background: transparent; } }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
  #app[data-anim="page"] .page { animation: pageIn .24s ease-out; }
  #app[data-anim="back"] main, #app[data-anim="tab"] main { animation: tabIn .22s ease-out; }
  #app[data-sheet-anim="1"] .shade { animation: shadeIn .22s ease-out; }
  #app[data-sheet-anim="1"] .sheet { animation: sheetIn .26s cubic-bezier(.2,.8,.3,1); }
  @media (prefers-reduced-motion: reduce) { #app * { animation: none !important; } }
  .hinc { cursor: pointer; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .pinerr { min-height: 20px; font-size: 14px; color: var(--debt); margin-bottom: 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 28px; }
  .pad button { width: 76px; height: 76px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--text); font-size: 28px; font-weight: 500; display: grid; place-items: center; }
  .pad button:active { background: var(--brand-soft); }
  .pad button.ic { background: none; border: 0; color: var(--brand); }
  .pad button.ic:active { background: var(--brand-soft); }
  html[data-theme=dark] .pinpage { --brand: #14B8A6; }
  .pinlink { margin-top: 24px; color: var(--brand); font-weight: 600; font-size: 15px; }
  .tplbox { background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-bottom: 4px; }
  .tplbox a { color: var(--brand); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600; }
  .chip:active { background: var(--brand-soft); }
  .hidden { display: none !important; }
  /* folding blocks on the customers page look like cards with a coloured stripe on the left */
  .section-title[data-a^=toggle] { background: var(--card) !important; border: 1px solid var(--line) !important; border-left: 5px solid currentColor !important; border-radius: 14px; padding: 16px 14px !important; width: 100% !important; margin: 10px 0 !important; font-size: 15px; text-transform: none; letter-spacing: 0; }
  .section-title[data-a^=toggle] span:first-child { color: var(--text); }
  .section-title[data-a^=toggle] .num { font-size: 17px; font-weight: 700; }
  /* the report's cards get the same stripe, each in its own colour */
  .card.row[data-a=openDays], .card.row[data-a=openMonth], .card.row[data-a=openYear], .card.row[data-a=openTop], .card.row[data-a=openLoans] { border-left: 5px solid #14B8A6; }
  .card.row[data-a=openMonth] { border-left-color: var(--pay); }
  .card.row[data-a=openYear], .card.row[data-a=openTop] { border-left-color: #F59E0B; }
  .card.row[data-a=openLoans] { border-left-color: var(--debt); }
</style>
</head>
<body>

<div id="app"></div>

<script src="i18n.js"></script>
<script>
'use strict';
// ---------- storage ----------
const hasNative = typeof window.Android !== 'undefined';
const APP_VERSION = '3.1.3 Rev. 00';
let db = { version: 1, people: [], tx: [], cats: [], loans: [], tpls: [], trash: [], removed: {} };

function load() {
  let raw = '';
  try { raw = hasNative ? Android.load() : (localStorage.getItem('ustaHesab') || ''); } catch (e) {}
  if (raw) {
    try { const d = JSON.parse(raw); if (d && d.people && d.tx) db = Object.assign(db, d); } catch (e) { alert(tr('Məlumat oxunmadı: {e}', { e: e.message })); }
  }
  if (!Array.isArray(db.trash)) db.trash = [];
  if (!Array.isArray(db.cats)) db.cats = [];
  if (!Array.isArray(db.loans)) db.loans = [];
  if (!Array.isArray(db.tpls)) db.tpls = [];
  if (!Array.isArray(db.cards)) db.cards = [];
  if (!Array.isArray(db.hides)) db.hides = [];
  if (!db.removed || typeof db.removed !== 'object') db.removed = {};
}
function save() {
  saveLocal();
  scheduleSync();
}
function saveLocal() {
  const json = JSON.stringify(db);
  let ok = true;
  try { ok = hasNative ? Android.save(json) : (localStorage.setItem('ustaHesab', json), true); } catch (e) { ok = false; }
  if (!ok) toast('Yadda saxlanmadı!');
  updateShortcuts();
}
// the two lines shown when the app icon is long-pressed
function updateShortcuts() {
  if (!hasNative || !Android.updateShortcuts) return;
  const d = byDay(db.tx.filter(t => t.date === today()))[0] || { pay: 0, debt: 0, exp: 0, inc: 0 };
  const fav = db.cats.find(c => c.star);
  const spent = db.tx.reduce((s, t) => s + (t.type === 'pexp' && t.date === today() && (!fav || t.cid === fav.id) ? t.amount : 0), 0);
  Android.updateShortcuts(tr(`Bu günkü gəlir: ${money(income(d))}`), fav ? tr('{name} bu gün: {sum}', { name: fav.name, sum: money(spent) }) : tr(`Bu gün xərclədiyim: ${money(spent)}`), fav ? fav.id : '');
  // the home-screen widget: today's income (it shows the "zero" text once the day is over)
  if (Android.setWidget) Android.setWidget(today(), tr('Bu günkü gəlir'), money(income(d)), money(0));
  // debts with a payment day still open: the phone reminds on that day (and every day after, until paid)
  if (Android.setDueList) Android.setDueList(JSON.stringify({ title: tr('Ödəniş günü çatıb'), more: tr('{0} müştərinin ödəniş günü çatıb'), items: dueItems() }));
}
function dueItems() {
  const out = [];
  for (const p of db.people) for (const d of debtState(p.id).debts) if (d.left > 0 && d.t.due) out.push({ d: d.t.due, line: p.name + ' — ' + money(d.left) });
  return out.sort((a, b) => a.d.localeCompare(b.d));
}
window.onLaunchTarget = function (target) {
  if (!target || state.pin) return;
  state.sheet = null; state.person = null; state.trash = false; state.loans = false;
  state.tab = target === 'people' ? 'people' : 'mine';
  state.cat = target.startsWith('cat:') && db.cats.some(c => c.id === target.slice(4)) ? target.slice(4) : null;
  render(); window.scrollTo(0, 0);
};
function toast(m) { m = tr(m); if (hasNative) Android.toast(m); else console.log(m); }
// dialogs speak the chosen language too
const nativeConfirm = window.confirm.bind(window), nativeAlert = window.alert.bind(window);
window.confirm = m => nativeConfirm(tr(String(m)));
window.alert = m => nativeAlert(tr(String(m)));

// ---------- Google Drive sync ----------
// Every record carries u (last change time); db.removed keeps ids that left a list and when.
// Merging keeps the newest copy of each record and drops it if it was removed after that.
const sync = { account: '', status: 'idle', msg: '', last: 0, running: false, again: false, timer: null };
try { sync.last = +localStorage.getItem('lastSync') || 0; } catch (e) {}
function mergeDb(a, b) {
  const removed = Object.assign({}, a.removed);
  for (const [id, t] of Object.entries(b.removed || {})) if (!(removed[id] >= t)) removed[id] = t;
  const out = Object.assign({}, a, { removed });
  for (const key of ['people', 'tx', 'cats', 'loans', 'tpls', 'cards', 'hides', 'trash']) {
    const m = new Map();
    for (const r of (a[key] || []).concat(b[key] || [])) {
      const cur = m.get(r.id);
      if (!cur || (r.u || 0) > (cur.u || 0)) m.set(r.id, r);
    }
    out[key] = [...m.values()].filter(r => !(removed[r.id] >= (r.u || 0)));
  }
  out.trash.sort((x, y) => y.at - x.at);
  for (const k of ['card', 'cur', 'lang']) if (b[k] && (!a[k] || (b[k].u || 0) > (a[k].u || 0))) out[k] = b[k];
  return out;
}
function scheduleSync() {
  if (!sync.account) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(runSync, 3000);
}
function runSync() {
  if (!sync.account || !hasNative) return;
  if (sync.running) { sync.again = true; return; }
  sync.running = true; sync.status = 'syncing'; refreshSyncUi();
  Android.syncStart();
}
window.onSyncRemote = function (text) {
  if (text) {
    try {
      const remote = JSON.parse(text);
      if (remote && Array.isArray(remote.people)) { const before = JSON.stringify(db); db = mergeDb(db, remote); if (JSON.stringify(db) !== before) { saveLocal(); renderKeep(); } }
    } catch (e) {
      // a damaged Drive copy would block every later sync; the phone's data replaces it
      toast('Drive-dakı fayl zədəli idi, telefondakı məlumatla yeniləndi');
    }
  }
  Android.syncUpload(JSON.stringify(db));
};
window.onSyncStatus = function (st, msg) {
  sync.running = false; sync.status = st; sync.msg = msg || '';
  if (st === 'ok') { sync.last = Date.now(); try { localStorage.setItem('lastSync', sync.last); } catch (e) {} }
  refreshSyncUi();
  if (sync.again) { sync.again = false; scheduleSync(); }
};
window.onSyncLinked = function (name) {
  sync.account = name; sync.status = 'idle'; toast('Google hesabı qoşuldu');
  render(); runSync();
};
let openedMonth = null;
window.onAppResume = function () {
  updateShortcuts();
  // a new month started while the app was open: jump to it so last month's totals don't linger
  const cur = today().slice(0, 7);
  if (openedMonth && openedMonth !== cur) { state.month = cur; state.day = null; state.mineDay = null; render(); }
  openedMonth = cur;
  if (state.tab === 'settings' && !state.sheet && !state.person && !state.trash) render();
  // the linked file is stored natively first, so pick it up even if onSyncLinked was missed
  if (!sync.account && hasNative && Android.syncLinked) {
    sync.account = Android.syncLinked();
    if (sync.account) { render(); return runSync(); }
  }
  if (sync.account && Date.now() - sync.last > 60000) runSync();
};
function refreshSyncUi() {
  if (state.tab === 'settings' && !state.person && !state.trash && !state.sheet) render();
}

// ---------- day / night theme (remembered on this phone only) ----------
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  if (hasNative && Android.setDarkBars) Android.setDarkBars(theme === 'dark');
}
applyTheme();

// ---------- helpers ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => (n < 10 ? '0' : '') + n;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

  let free = 0;

    const amt = t.type === 'pay' ? t.amount : t.type === 'adj' && t.amount < 0 ? -t.amount : 0;
    if (!amt) continue;

// Which payments paid which debt, the same way debtState() counts: a payment tied to a debt

    if (own) { const use = Math.min(own.left, rest); if (use) { own.left -= use; rest -= use; (by[own.t.id] = by[own.t.id] || []).push({ t, use }); } }

function personHistory(tx) {
  const st = debtState(tx[0].pid), paidIds = st.paid;
  const left = {}; st.debts.forEach(d => { left[d.t.id] = d.left; });
  const al = payAlloc(tx);
  const isDebt = t => t.type === 'debt' || (t.type === 'adj' && t.amount > 0);
  // work added later to a job ("addTo") sits in that job's box
  // the job a line belongs to, also for extra work added onto an extra line
  const rootOf = x => { let r = x; for (let i = 0; i < 20 && r.addTo; i++) { const up = tx.find(y => y.id === r.addTo); if (!up) break; r = up; } return r.id; };
  const kids = id => tx.filter(x => x.addTo && x.id !== id && rootOf(x) === id).sort((a, c) => a.date.localeCompare(c.date) || a.created - c.created);
  const top = t => !(t.addTo && tx.some(x => x.id === t.addTo));
  const openGroup = t => !paidIds.has(t.id) || kids(t.id).some(k => !paidIds.has(k.id));
  const pays = t => (al.by[t.id] || []).map(x => txRow(x.t, paidIds, 0, true, x.use)).join('');
  const box = t => '<div class="list" style="margin-bottom:10px">' + txRow(t, paidIds, left[t.id] == null ? t.amount : left[t.id]) + pays(t)
    + kids(t.id).map(k => txRow(k, paidIds, left[k.id] == null ? k.amount : left[k.id], true) + pays(k)).join('') + '</div>';
  const groupSum = t => t.amount + kids(t.id).reduce((x, k) => x + k.amount, 0);
  const open = tx.filter(t => isDebt(t) && top(t) && openGroup(t));
  const done = tx.filter(t => isDebt(t) && top(t) && !openGroup(t));
  let h = '<div class="section-title" style="color:var(--debt)">Borclar (' + open.length + ')</div>';
  h += open.length ? byDay(open).map(d => `
        <div class="dayhead"><b>${fmtDate(d.date)}</b><span class="num"><span class="debt">+${money(d.items.reduce((x, t) => x + groupSum(t), 0))}</span></span></div>
        ${d.items.map(box).join('')}`).join('')
    : '<div class="empty" style="padding:16px">Ödənilməmiş borc yoxdur 👍</div>';
  if (done.length) h += '<div class="section-title" style="color:var(--pay)">Ödənilənlər (' + done.length + ')</div>' + done.map(box).join('');
  const losses = tx.filter(t => t.type === 'loss');
  if (losses.length) h += '<div class="section-title" style="color:var(--debt)">📉 Ziyan (' + losses.length + ')</div><div class="list">' + losses.map(t => txRow(t, paidIds, 0)).join('') + '</div>';
  // money paid on top of every debt (overpayment) still has to be visible somewhere
  const extra = al.extra.filter(f => f.rest > 0);
  if (extra.length) h += '<div class="section-title">Artıq ödəniş</div><div class="list">' + extra.map(f => txRow(f.t, paidIds, 0, false, f.rest)).join('') + '</div>';
  return h;
}

function miniCard(action, icon, title, sub) {
  return `<button class="card row" data-a="${action}" style="margin:12px 0 0;border-radius:14px">
      <div style="font-size:26px">${icon}</div>

      <span style="font-size:22px;color:var(--muted)">›</span></button>`;
}
// totals for 1 January – 31 December of a year
function yearTotals(y) {
  const r = { debt: 0, pay: 0, exp: 0, inc: 0, cost: 0, icost: 0, loss: 0 };
  for (let m = 1; m <= 12; m++) { const t = totals(y + '-' + pad(m)); for (const k in r) r[k] += t[k]; }
  return r;
}
// income each usta brought in a month: work written minus its spare parts, best first
function topUstas(month) {
  const by = {};
  db.tx.filter(x => (x.type === 'debt' || (x.type === 'adj' && !x.wo)) && monthKey(x.date) === month && x.pid && nameOf(x.pid) !== '(silinib)' && !db.hides.some(hd => hd.pid === x.pid)).forEach(x => {
    const w = by[x.pid] || (by[x.pid] = { v: 0, n: 0, jobs: new Set() });
    w.v += x.amount - (x.cost || 0); if (x.type === 'debt') w.jobs.add(x.addTo || x.id); w.n = w.jobs.size;
  });
  return Object.entries(by).filter(([, w]) => w.n).sort((a, c) => c[1].v - a[1].v);
}
// one customer's work entries (same rule as topUstas)
const ustaWork = pid => db.tx.filter(x => x.pid === pid && (x.type === 'debt' || (x.type === 'adj' && !x.wo)));
// usta's name, also for one whose name was deleted after paying everything
function nameOf(pid) {
  const p = db.people.find(x => x.id === pid);
  if (p) return p.name;
  const t = db.tx.find(x => x.pid === pid && x.pname);
  if (t) return t.pname;
  // deleted before names were kept on the entries: the trash still knows it
  const e = db.trash.find(x => x.kind === 'person' && x.person.id === pid);
  return e ? e.person.name : '(silinib)';
}

  const step = n => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  return `<div class="monthbar"><button class="iconbtn" data-a="dayStep" data-v="${step(-1)}">‹</button><b data-a="pickDate" style="cursor:pointer">${fmtDate(d)}<span> ▾</span></b><button class="iconbtn" data-a="dayStep" data-v="${step(1)}">›</button></div>

function monthBar() {

// newest entry in a section: "son: 10 ₼ · 22:41" (with the date if it wasn't today)
function lastSpent(cid) {
  let last = null;
  for (const t of db.tx) if (t.type === 'pexp' && t.cid === cid && (!last || (t.created || 0) > (last.created || 0))) last = t;
  if (!last) return '';
  const c = new Date(last.created || 0);
  const when = (last.date === today() ? '' : fmtDate(last.date).replace(/ \d{4}$/, '') + ', ') + pad(c.getHours()) + ':' + pad(c.getMinutes());
  return `<small>son: ${money(last.amount)} · ${when}</small>`;
}
function renderMine() {
  if (!db.cats.length) return `<div class="empty">Xərclərinizi bölmələrə ayırın.<br>Hazır bölmə seçin və ya aşağıdakı “+ Bölmə” ilə özünüz yaradın.</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${CAT_IDEAS.map(n => `<button class="mini" data-a="quickCat" data-v="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>`;
  const day = state.mineDay;
  const sum = cid => day ? db.tx.reduce((s, t) => s + (t.type === 'pexp' && t.cid === cid && t.date === day ? t.amount : 0), 0) : catSum(cid, state.month);
  const total = db.cats.reduce((s, c) => s + sum(c.id), 0);
  const list = db.cats.map(c => ({ c, v: sum(c.id) })).sort((a, b) => (b.c.star ? 1 : 0) - (a.c.star ? 1 : 0) || b.v - a.v || a.c.name.localeCompare(b.c.name, 'az'));
  return mineBar() + `<div class="list">${list.map(({ c, v }) => `
      <button class="row" data-a="openCat" data-v="${c.id}" data-hold="cat:${c.id}">
        <div class="avatar" style="background:var(--exp-soft);color:var(--exp)">${esc(initials(c.name))}</div>
        <div class="grow"><div class="t">${c.star ? '⭐ ' : ''}${esc(c.name)}</div><div class="s">${total && v ? Math.round(v / total * 100) + (day ? '% o gün' : '% bu ay') : day ? 'O gün xərc yoxdur' : 'Bu ay xərc yoxdur'}</div></div>
        <div class="amt num ${v ? 'exp' : 'zero'}">${money(v)}${c.star ? lastSpent(c.id) : ''}</div>
      </button>`).join('')}</div>`;
}

function renderTrash() {

const WA_ICON = '<svg viewBox="0 0 24 24" width="22" height="22" style="vertical-align:-5px;margin-right:6px"><path fill="#25D366" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/><path fill="#fff" d="M8.6 7.2c.2-.4.5-.4.8-.4h.6c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.4 0 .6l-.5.7c-.1.2-.2.3 0 .6.5.9 1.3 1.7 2.3 2.2.3.1.4.1.6-.1l.7-.8c.2-.2.4-.2.6-.1l1.8.9c.3.1.4.2.4.4 0 .5-.2 1.2-.6 1.5-.5.4-1.2.7-2 .6-1.4-.2-3.3-1.1-4.7-2.6S7.9 10 7.8 9c-.1-.8.4-1.5.8-1.8z"/></svg>';
const FINGER_ICON = '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 11v3a8 8 0 0 1-1.5 4.7M8.5 20a10 10 0 0 0 1.5-5.5V11a2 2 0 0 1 4 0v1M16 15.5c0 1.6-.2 3-.7 4.4M6.3 17A11 11 0 0 0 7 13v-2a5 5 0 0 1 9-3M17.7 10.6c.2.5.3 1 .3 1.6v1M4.2 14.5A13 13 0 0 0 5 11a7 7 0 0 1 12.6-4.2M3 7.5a9.6 9.6 0 0 1 2-2.6"/></svg>';
const BACK_ICON = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 5M12 9l5 5"/></svg>';
function renderPin() {
  const P = state.pin;
  const title = { unlock: 'PIN kodu daxil edin', verify: 'Hazırkı PIN kodu daxil edin', set1: 'Yeni PIN kod', set2: 'PIN kodu təkrar yazın' }[P.mode];
  const dots = Array.from({ length: P.len }, (_, i) => `<i class="${i < P.entered.length ? 'on' : ''}"></i>`).join('');
  // the fingerprint key sits left of 0 when it can be used, the delete key on the right
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => `<button data-a="pinKey" data-v="${k}">${k}</button>`).join('')
    + (P.mode === 'unlock' && bioOn() ? `<button class="ic" data-a="bioAsk" title="Barmaq izi">${FINGER_ICON}</button>` : '<span></span>')
    + `<button data-a="pinKey" data-v="0">0</button><button class="ic" data-a="pinKey" data-v="del" title="Sil">${BACK_ICON}</button>`;
  return `<div class="pinpage">
    <img class="logo" src="icon.png" alt="">
    <h1>Hesabat</h1>
    <h2>${title}</h2>
    ${P.mode === 'set1' ? `<div class="seg" style="width:220px;margin:0 auto 6px"><button class="pay ${P.len === 4 ? 'on' : ''}" data-a="pinLen" data-v="4">4 rəqəm</button><button class="pay ${P.len === 6 ? 'on' : ''}" data-a="pinLen" data-v="6">6 rəqəm</button></div>` : ''}
    <div class="dots ${P.err ? 'shake' : ''}" id="pinDots">${dots}</div>
    <div class="pinerr" id="pinErr">${esc(P.err || '')}</div>
    <div class="pad">${keys}</div>
    ${P.mode === 'unlock' ? '<button class="pinlink" data-a="pinForgot">PIN-i unutdum</button>' : '<button class="pinlink" data-a="pinCancel">Ləğv et</button>'}
  </div>`;
}
function pinDone() {
  const P = state.pin, code = P.entered;
  P.entered = ''; P.err = '';
  if (P.mode === 'unlock' || P.mode === 'verify') {
    if (!Android.checkPin(code)) { P.err = 'Səhv PIN kod'; return render(); }
    if (P.mode === 'unlock') { state.pin = null; render(); if (window.onAppResume) window.onAppResume(); return; }
    if (P.next === 'remove') { Android.clearPin(); state.pin = null; toast('PIN kod silindi'); return render(); }
    Object.assign(P, { mode: 'set1', len: 4 });
  } else if (P.mode === 'set1') {
    Object.assign(P, { mode: 'set2', first: code });
  } else if (code === P.first) {
    Android.setPin(code); state.pin = null; toast('PIN kod qoyuldu');
  } else {
    Object.assign(P, { mode: 'set1', first: '', err: 'PIN kodlar eyni deyil, yenidən yazın' });
  }
  render();
}
const bioOn = () => hasNative && Android.bioEnabled && Android.bioEnabled() && Android.bioAvailable();
window.showPinLock = function (askBio) {
  if (!(state.pin && state.pin.mode === 'unlock')) {
    state.sheet = null;
    state.pin = { mode: 'unlock', len: Android.pinLength(), entered: '', err: '' };
    render();
  }
  if (askBio && bioOn()) Android.bioPrompt();
};
window.onBioOk = function () {
  if (state.pin && state.pin.mode === 'unlock') { state.pin = null; render(); if (window.onAppResume) window.onAppResume(); }
};
window.onPinReset = function () {
  state.pin = null; render();

};

// ---------- charts (simple bars; one or two values per group) ----------
const MONTHS_SHORT = ['Yan', 'Fev', 'Mar', 'Apr', 'May', 'İyn', 'İyl', 'Avq', 'Sen', 'Okt', 'Noy', 'Dek'];
const monthShort = i => lang() === 'az' ? MONTHS_SHORT[i] : monthName(MONTHS[i]).slice(0, 3);
function barChart(groups, labels, colors) {
  const W = 320, H = 150, top = 14, bot = 18, ph = H - top - bot;
  const all = groups.flat(), max = Math.max(0, ...all), min = Math.min(0, ...all), span = (max - min) || 1;
  const y0 = top + max / span * ph, gw = W / groups.length, k = groups[0].length, bw = Math.max(1.5, gw * 0.8 / k);
  let out = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible" role="img">`;
  out += `<line x1="0" x2="${W}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" style="stroke:var(--line);stroke-width:1"/>`;
  groups.forEach((g, i) => g.forEach((v, j) => {
    if (!v) return;
    const hgt = Math.max(1, Math.abs(v) / span * ph), x = i * gw + gw * 0.1 + j * bw;
    out += `<rect x="${x.toFixed(1)}" y="${(v > 0 ? y0 - hgt : y0).toFixed(1)}" width="${Math.max(1, bw - 0.6).toFixed(1)}" height="${hgt.toFixed(1)}" rx="1" style="fill:${v < 0 && k === 1 ? 'var(--debt)' : colors[j]}"/>`;
  }));
  labels.forEach((l, i) => { if (l) out += `<text x="${(i * gw + gw / 2).toFixed(1)}" y="${H - 4}" font-size="9" text-anchor="middle" style="fill:var(--muted)">${esc(l)}</text>`; });
  if (max > 0) out += `<text x="0" y="9" font-size="9" style="fill:var(--muted)">${esc(money(max))}</text>`;
  return out + '</svg>';
}

// ---------- a customer's whole account (shared as text or printed) ----------
function accountRows(p) {
  const tx = db.tx.filter(t => t.pid === p.id && !t.corr).sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0));
  const left = {}; debtState(p.id).debts.forEach(d => { left[d.t.id] = d.left; });
  let sumDebt = 0, sumPay = 0;
  const rows = [];
  for (const t of tx) {
    if (t.type === 'debt') { sumDebt += t.amount; rows.push({ t, kind: 'Borc', amt: t.amount, left: left[t.id] }); }
    else if (t.type === 'adj' && !t.wo) { sumDebt += t.amount; rows.push({ t, kind: 'Məbləğ düzəlişi', amt: t.amount }); }
    else if (t.type === 'adj') rows.push({ t, kind: 'Borc silindi', amt: t.amount });
    else if (t.type === 'pay') { sumPay += t.amount; rows.push({ t, kind: 'Ödəniş', amt: -t.amount }); }
  }
  return { rows, sumDebt, sumPay, bal: balanceOf(p.id) };
}
const accNote = t => t.note && !['Nağd', 'Tam ödədi', 'Ödəniş', 'Borc silindi'].includes(t.note) ? t.note : '';
const accState = r => r.kind !== 'Borc' || r.left == null ? '' : r.left <= 0 ? tr('ödənilib')
  : (r.left < r.amt ? tr('qalıb {sum}', { sum: money(r.left) }) : tr('ödənilməyib')) + (r.t.due ? ' · ' + tr('ödəniş tarixi') + ' ' + tr(fmtDate(r.t.due)) : '');
function accountText(p) {
  const a = accountRows(p), L = [p.name];
  if (p.phone) L.push(tr('Telefon') + ': ' + p.phone);
  L.push(tr(fmtDate(today())), '');
  for (const r of a.rows) {
    const st = accState(r), n = accNote(r.t);
    L.push('• ' + tr(fmtDate(r.t.date)) + ' · ' + tr(r.kind) + (n ? ' · ' + n : '') + ': ' + (r.amt > 0 ? '+' : '') + money(r.amt) + (st ? ' (' + st + ')' : ''));
  }
  L.push('', tr('Ümumi yazılan borc') + ': ' + money(a.sumDebt), tr('Ümumi ödəniş') + ': ' + money(a.sumPay), tr('Qalıq') + ': ' + money(a.bal));
  return L.join('\n');
}
function accountHtml(p) {

    if (state.sheet.dup !== undefined && norm(state.sheet.dupName) !== norm(name)) delete state.sheet.dup;
    // a new name that is already in the list: ask first whether it is the same customer
    if (!state.sheet.id && name && state.sheet.dup === undefined) {
      const same = db.people.find(x => norm(x.name) === norm(name));
      if (same) {
        const vals = {};

      const a = parseAmount(val('f_amount')), cost = parseAmount(val('f_cost'));
      if (!a && !cost) return toast('Məbləğ yazın');
      let pid = null;
      if (name) {
        if (dup) pid = dup.id;
        else { const p = { id: uid(), name, phone: val('f_phone').trim(), created: Date.now(), u: Date.now() }; db.people.push(p); pid = p.id; }
      }
      db.tx.push(Object.assign({ id: uid(), pid, type: 'loss', amount: a, date: val('f_date') || today(), note: val('f_note').trim() || 'Ziyan', created: Date.now(), u: Date.now() }, cost ? { cost } : {}));
      save(); state.sheet = null; render(); return toast('Ziyan yazıldı');
    }
    if (mode === 'cash' && !name) {
      const a = parseAmount(val('f_amount'));
      if (!a) return toast('Məbləğ yazın');
      const cost = parseAmount(val('f_cost'));
      db.tx.push(Object.assign({ id: uid(), pid: null, type: 'inc', cash: true, amount: a, date: val('f_date') || today(), note: val('f_note').trim() || 'Nağd iş', created: Date.now(), u: Date.now() }, cost ? { cost } : {}));
      save(); state.sheet = null; render(); return toast('Yadda saxlandı');
    }
    if (!name) return toast('Ad yazın');

  saveTx() {
    const amount = state.sheet.type === 'adj' ? parseSigned(val('f_amount')) : parseAmount(val('f_amount'));
    const date = val('f_date') || today();
    const note = val('f_note').trim();
    const s = state.sheet;
    if (s.id && s.markPaid) {
      // a payment for an existing debt; the debt itself is not touched
      const d = db.tx.find(x => x.id === s.id);
      if (!amount) return toast('Məbləğ yazın');
      db.tx.push({ id: uid(), pid: d.pid, type: 'pay', amount, forDebt: d.id, date, note: d.note ? 'Ödəniş: ' + d.note : 'Ödəniş', created: Date.now(), u: Date.now() });
      save(); state.sheet = null; render();
      return toast('Ödəniş yazıldı');
    }
    const cash = s.cash || s.type === 'inc';
    const editing = s.id && db.tx.find(x => x.id === s.id);
    if (editing && editing.other && !note) return toast('Gəlirin adını yazın');
    const cost = s.type === 'debt' || cash || s.type === 'loss' ? parseAmount(val('f_cost')) : 0;
    // an "extra parts" line added to an older job may have no amount of its own
    const partsOnly = s.id && cost && ((db.tx.find(x => x.id === s.id) || {}).addTo || s.type === 'loss');
    if (!amount && !partsOnly) return toast('Məbləğ yazın');
    const old = s.id && db.tx.find(x => x.id === s.id);
    // more work added later to an older job: the extra is written on today, tied to that job,
    // so it counts as today's income while the job keeps its own day
    // the same goes for more spare parts bought for it today
    const oldCost = old ? old.cost || 0 : 0;
    const cashPay = old && old.type === 'debt' && db.tx.find(x => x.type === 'pay' && x.forDebt === old.id && x.note === 'Nağd');
    if (old && !cashPay && old.type === 'debt' && s.type === 'debt' && old.date < today() && date === old.date && !s.markPaid
      && amount >= old.amount && cost >= oldCost && (amount > old.amount || cost > oldCost)) {
      const add = amount - old.amount, addCost = cost - oldCost;
      Object.assign(old, { note, u: Date.now() });
      const kid = { id: uid(), pid: old.pid, type: 'debt', amount: add, date: today(), note: note || old.note, addTo: old.addTo || old.id, created: Date.now(), u: Date.now() };
      if (addCost) kid.cost = addCost;
      db.tx.push(kid);
      save(); state.sheet = null; render();
      return toast(add ? tr('Əlavə {sum} bu günə yazıldı', { sum: money(add) }) : tr('Əlavə xərc {sum} bu günə yazıldı', { sum: money(addCost) }));
    }
    if (s.id) {
      const was = { type: old.type, amount: old.amount, cost: old.cost || 0, date: old.date };
      const t = Object.assign(old, { type: s.type, amount, date, note, u: Date.now() });
      if (cost) t.cost = cost; else delete t.cost;
      const due = t.type === 'debt' ? val('f_due') : '';
      if (due) t.due = due; else delete t.due;
      if (cashPay && t.type === 'debt') Object.assign(cashPay, { amount, date, u: Date.now() });
      const dA = was.amount - amount, dC = was.cost - cost;
      if (was.type === 'debt' && t.type === 'debt' && t.pid && date === was.date && monthKey(date) !== today().slice(0, 7) && (dA || dC)) {
        const now = Date.now(), back = { id: uid(), pid: null, type: 'debt', corr: true, amount: dA, date, note: 'Düzəldilmiş borc', created: now, u: now };
        if (dC) back.cost = dC;
        db.tx.push(back, { id: uid(), pid: null, type: 'debt', corr: true, amount: -(dA - dC), date: today(), note: 'Düzəldilmiş borc', created: now, u: now });
      }
    } else {
      const t = { id: uid(), pid: s.type === 'exp' || s.type === 'pexp' || s.type === 'inc' ? null : state.person, type: s.type, amount, date, note, created: Date.now(), u: Date.now() };
      if (s.type === 'pexp') t.cid = state.cat;
      if (cash) t.cash = true;
      if (cost) t.cost = cost;
      if (s.type === 'debt' && val('f_due')) t.due = val('f_due');
      db.tx.push(t);
    }
    // show the month the entry landed in, otherwise it seems to vanish
    if (s.type === 'pexp' || s.type === 'exp' || (s.type === 'inc' && !cash)) state.month = monthKey(date);
    save(); state.sheet = null; render();
    toast('Yadda saxlandı');
  },

  restore(v) {

    if (e.kind === 'tx' && e.tx.pid && !db.people.some(p => p.id === e.tx.pid)) {
      const owner = db.trash.find(x => x.kind === 'person' && x.person.id === e.tx.pid);

      back.push(owner);
    }
    if (e.kind === 'tx' && e.tx.cid && !db.cats.some(c => c.id === e.tx.cid)) {
      const owner = db.trash.find(x => x.kind === 'cat' && x.cat.id === e.tx.cid);
      if (!owner) return toast('Bu xərcin bölməsi həmişəlik silinib');
      back.push(owner);
    }
    const t = Date.now() + 1;
    for (const b of back) {

      if (b.kind === 'person') { db.people.push(Object.assign(b.person, { u: t })); b.tx.forEach(x => db.tx.push(Object.assign(x, { u: t }))); }

      else if (b.kind === 'cat') { db.cats.push(Object.assign(b.cat, { u: t })); b.tx.forEach(x => db.tx.push(Object.assign(x, { u: t }))); }
      else {

      }
      (b.corr || []).forEach(cid => { db.removed[cid] = Date.now(); }); db.tx = db.tx.filter(x => !(b.corr || []).includes(x.id));
    }
    db.trash = db.trash.filter(x => !back.includes(x));
    save(); render();
    toast(back.length > 1 ? 'Aid olduğu yerlə birlikdə qaytarıldı' : 'Qaytarıldı');

// An usta who has paid everything goes away by name only: their work and payments stay in the
// income totals. An usta who still owes is removed with all their entries.
function trashPerson(id, withIncome) {
  const p = db.people.find(x => x.id === id);
  const now = Date.now();
  const keep = !withIncome && balanceOf(id) <= 0;
  const corr = keep ? [] : corrFor(db.tx.filter(t => t.pid === id));
  db.trash.unshift({ id: uid(), kind: 'person', person: p, tx: keep ? [] : db.tx.filter(t => t.pid === id), keptTx: keep, corr, at: now, u: now });
  db.removed[id] = now;
  db.people = db.people.filter(x => x.id !== id);
  // the name stays on the kept entries, so reports can still show who the work was for
  if (keep) db.tx.forEach(t => { if (t.pid === id) { t.pname = p.name; t.u = now; } });
  if (!keep) {
    db.tx.forEach(t => { if (t.pid === id) db.removed[t.id] = now; });
    db.tx = db.tx.filter(t => t.pid !== id);
  }
  save(); state.sheet = null; if (state.person === id) state.person = null; render();
  toast(tr('{name} zibil qutusuna atıldı', { name: p.name }));
}
// "Müştərilərin ümumi borcu": swiping a customer away clears what they still owe; it comes off this month's income
// (and so the whole period's), never off an old month or a single day
function writeOff(pid, keepIncome) {
  const p = db.people.find(x => x.id === pid), left = balanceOf(pid);
  if (!p || left <= 0) return render();
  const now = Date.now(), t = { id: uid(), pid, type: 'adj', wo: true, amount: -left, date: today(), note: 'Borc silindi', created: now, u: now };
  if (keepIncome) t.woKeep = true;
  db.tx.push(t);
  db.trash.unshift({ id: uid(), kind: 'wo', txId: t.id, name: p.name, amount: left, keepIncome: !!keepIncome, at: now, u: now });
  save(); render(); toast('Borc silindi');
}
function trashLoan(id) {
  const l = db.loans.find(x => x.id === id);
  db.trash.unshift({ id: uid(), kind: 'loan', loan: l, at: Date.now(), u: Date.now() });
  db.removed[id] = Date.now();
  db.loans = db.loans.filter(x => x.id !== id);
  save(); state.sheet = null; render();
  toast(tr('{name} zibil qutusuna atıldı', { name: l.name }));
}
function trashCat(id) {
  const c = db.cats.find(x => x.id === id);
  const now = Date.now();
  db.trash.unshift({ id: uid(), kind: 'cat', cat: c, tx: db.tx.filter(t => t.cid === id), at: now, u: now });
  db.removed[id] = now;
  db.tx.forEach(t => { if (t.cid === id) db.removed[t.id] = now; });
  db.cats = db.cats.filter(x => x.id !== id);
  db.tx = db.tx.filter(t => t.cid !== id);
  save(); state.sheet = null; if (state.cat === id) state.cat = null; render();
  toast(tr('{name} zibil qutusuna atıldı', { name: c.name }));
}
// Debts from earlier months that are being deleted: two hidden entries each (pid null, corr), one gives
// the old month its work back, one takes it from today, so only this month's income goes down.
function corrFor(list) {
  const cm = today().slice(0, 7), now = Date.now(), out = [];
  for (const t of list) {
    if (t.type !== 'debt' || !t.pid || t.corr || monthKey(t.date) === cm) continue;
    const back = { id: uid(), pid: null, type: 'debt', corr: true, amount: t.amount, date: t.date, note: 'Silinmiş borc', created: now, u: now };
    if (t.cost) back.cost = t.cost;
    out.push(back, { id: uid(), pid: null, type: 'debt', corr: true, amount: -(t.amount - (t.cost || 0)), date: today(), note: 'Silinmiş borc', created: now, u: now });
  }
  db.tx.push(...out);
  return out.map(x => x.id);
}
// a deleted debt takes the payment made with "Ödənildi" for it along, so no stray payment is left behind
function trashTx(id) {
  const t = db.tx.find(x => x.id === id);
  // the job's extra lines (also extra added onto an extra) and the payments tied to any of them
  const fam = new Set([id]);
  if (t.type === 'debt') for (let grew = true; grew;) { grew = false; for (const x of db.tx) if (x.addTo && fam.has(x.addTo) && !fam.has(x.id)) { fam.add(x.id); grew = true; } }
  const linked = t.type === 'debt' ? db.tx.filter(x => x.id !== id && (fam.has(x.id) || (x.forDebt && fam.has(x.forDebt)))) : [];
  // a debt from an earlier month comes off this month's income; that month's own figures stay as they were.
  // Two hidden entries (pid null, corr) do it: one gives the old month its work back, one takes it from today.
  const corr = corrFor([t].concat(linked));
  db.trash.unshift({ id: uid(), kind: 'tx', tx: t, with: linked, corr, at: Date.now(), u: Date.now() });
  db.removed[id] = Date.now();
  linked.forEach(x => { db.removed[x.id] = Date.now(); });
  db.tx = db.tx.filter(x => x.id !== id && !linked.includes(x));
  save(); state.sheet = null; render();
  toast('Zibil qutusuna atıldı');
}
function download(name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }));
  a.download = name; a.click();
}
window.onContactPicked = function (name, phone) {
  const n = document.getElementById('f_name'), ph = document.getElementById('f_phone');
  if (!ph) return;
  ph.value = phone.trim();
  if (n && name.trim()) { n.value = name.trim(); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
};
window.onImported = function (text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { return alert('Fayl düzgün deyil'); }
  if (!d || !Array.isArray(d.people) || !Array.isArray(d.tx)) return alert('Bu fayl Hesabat faylı deyil');
  if (!confirm(`Faylda ${d.people.length} müştəri və ${d.tx.length} əməliyyat var. Hazırkı məlumatlar əvəz olunsun?`)) return;
  const before = db;
  db = Object.assign({ version: 1 }, d);
  if (!Array.isArray(db.trash)) db.trash = [];
  if (!Array.isArray(db.cats)) db.cats = [];
  if (!Array.isArray(db.loans)) db.loans = [];
  if (!Array.isArray(db.tpls)) db.tpls = [];
  if (!Array.isArray(db.cards)) db.cards = [];
  if (!Array.isArray(db.hides)) db.hides = [];
  if (!db.removed || typeof db.removed !== 'object') db.removed = {};
  // the imported data must win the next sync: its records count as just changed, and what is
  // on the phone but not in the file counts as just deleted (otherwise Drive would bring it back)
  const now = Date.now(), keep = new Set();
  for (const key of ['people', 'tx', 'cats', 'loans', 'tpls', 'cards', 'hides', 'trash']) db[key].forEach(r => { r.u = now; keep.add(r.id); delete db.removed[r.id]; });
  for (const key of ['people', 'tx', 'cats', 'loans', 'tpls', 'cards', 'hides', 'trash']) (before[key] || []).forEach(r => { if (!keep.has(r.id)) db.removed[r.id] = now; });
  save(); state.person = null; state.tab = 'people'; render();
  toast('Bərpa olundu');
};

// long press -> action menu, swipe left -> trash
let holdTimer = null, held = false, holdX = 0, holdY = 0;
let swipeEl = null, swipeDx = 0, swipeMode = null, swipeBg = null;
function openHoldMenu(el) {
  const [target, id] = el.dataset.hold.split(':');
  held = true;
  if (hasNative && Android.haptic) Android.haptic();
  state.sheet = { kind: 'menu', target, id };
  render();
}
// a swipe asks first, in the app's own window: what exactly should go
function askDelete(hold, fromToday) {
  const [target, id] = hold.split(':');
  const keep = { color: 'pay' }, drop = { color: 'debt' };
  let name = '', info = '', opts = [];
  if (fromToday) {
    // "Bu gün yazılanlar": take the row off today's list (a debt stays with the debtors), or delete today's work with its income
    const p = target === 'person' && db.people.find(x => x.id === id), t = target === 'tx' && db.tx.find(x => x.id === id);
    if (!p && !t) return render();
    const work = p ? db.tx.filter(x => x.pid === id && x.type === 'debt' && x.date === today()) : [t];
    const sum = work.reduce((x, w) => x + (w.type === 'loss' ? 0 : w.amount - (w.cost || 0)), 0);
    name = p ? p.name : (t.note || tr(txLabel(t))); info = p ? tr('Bu gün: +{sum}', { sum: money(sum) }) : money(t.amount);
    opts = [Object.assign({ icon: '👤', label: tr(p ? 'Müştərini sil' : 'Sil'), sub: p && balanceOf(id) > 0 ? tr('Bu günün siyahısından çıxır, borclularda qalır, gəlir dəyişmir') : tr('Bu günün siyahısından çıxır, gəlir dəyişmir'), run: () => hideToday(hold) }, keep),
      Object.assign({ icon: '📉', label: tr('Gəliri sil'), sub: t && t.type === 'loss' ? tr('Ziyan silinir') : tr('Bu günkü işi silinir, {sum} gəlirdən çıxılır', { sum: money(sum) }), run: () => { work.forEach(w => { if (db.tx.some(x => x.id === w.id)) trashTx(w.id); }); } }, drop)];
    askBack = null; state.sheet = { kind: 'askDel', name, info, opts, sel: 0 }; return render();
  }
  if (target === 'wo' || target === 'person') {
    const p = db.people.find(x => x.id === id); if (!p) return render();
    const b = balanceOf(id), since = debtSince(id), days = since ? Math.floor((new Date(today()) - new Date(since)) / 864e5) : 0;
    name = p.name;
    if (b > 0) {
      info = tr('Borcu: {sum}', { sum: money(b) }) + (since ? ' · ' + (days <= 0 ? tr('bu gündən') : tr('{0} gündür', { 0: days })) : '');
      opts = [Object.assign({ icon: '🧾', label: tr('Borcu sil, gəlir qalsın'), sub: tr('Borc 0 olur, gəlir dəyişmir'), run: () => writeOff(id, true) }, keep),
        Object.assign({ icon: '📉', label: tr('Borcu sil, gəlirdən çıxılsın'), sub: tr('Borc 0 olur, {sum} bu ayın gəlirindən çıxılır', { sum: money(b) }), run: () => writeOff(id, false) }, drop)];
    } else {
      info = tr('Borcu yoxdur');
      opts = [Object.assign({ icon: '👤', label: tr('Yalnız adı sil'), sub: tr('Siyahıdan çıxır, gəlir qalır'), run: () => trashPerson(id) }, keep),
        Object.assign({ icon: '📉', label: tr('Gəliri ilə birlikdə sil'), sub: tr('İşləri silinir, gəliri də çıxılır'), run: () => trashPerson(id, true) }, drop)];
    }
  } else if (target === 'tx') {
    const t = db.tx.find(x => x.id === id); if (!t) return render();
    name = tr(txLabel(t)) + ' ' + money(t.amount); info = fmtDate(t.date) + (t.note ? ' · ' + t.note : '');
    opts = [Object.assign({ icon: '🗑', label: tr('Sil'), sub: t.type === 'pay' ? tr('Ödəniş silinir, borc qayıdır') : t.type === 'pexp' ? tr('Xərc silinir') : tr('Silinir, gəlirdən çıxılır'), run: () => trashTx(id) }, drop)];
  } else if (target === 'cat') {
    const c = db.cats.find(x => x.id === id); if (!c) return render();
    name = c.name; opts = [Object.assign({ icon: '🗑', label: tr('Bölməni xərcləri ilə sil'), sub: tr('{0} xərc', { 0: db.tx.filter(t => t.cid === id).length }), run: () => trashCat(id) }, drop)];
  } else if (target === 'loan') {
    const l = db.loans.find(x => x.id === id); if (!l) return render();
    name = l.name; info = money(loanLeft(l)); opts = [Object.assign({ icon: '🗑', label: tr('Sil'), sub: tr('Borc verdiyiniz silinir'), run: () => trashLoan(id) }, drop)];
  }
  askBack = state.sheet && state.sheet.kind !== 'askDel' ? state.sheet : null;
  state.sheet = { kind: 'askDel', name, info, opts, sel: 0 }; render();
}
let askBack = null;
function trashByHold(hold) {
  const [target, id] = hold.split(':');
  ({ person: trashPerson, cat: trashCat, tx: trashTx, loan: trashLoan, wo: writeOff })[target](id);
}
app.addEventListener('touchstart', e => {
  const th = e.target.closest('[data-tophold]');
  held = false;
  if (th) {
    holdX = e.touches[0].clientX; holdY = e.touches[0].clientY; swipeEl = null;
    holdTimer = setTimeout(() => { held = true; if (hasNative && Android.haptic) Android.haptic(); actions.hideTop(th.dataset.tophold); }, 550);
    return;
  }
  const el = e.target.closest('[data-hold]');
  const wo = el && el.dataset.hold.startsWith('wo:');
  if (!el || (state.sheet && !wo)) return;
  holdX = e.touches[0].clientX; holdY = e.touches[0].clientY;
  swipeEl = el; swipeDx = 0; swipeMode = null;
  if (!wo && !el.closest('[data-today]')) holdTimer = setTimeout(() => { swipeEl = null; openHoldMenu(el); }, 550);
}, { passive: true });
app.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - holdX, dy = e.touches[0].clientY - holdY;
  if (holdTimer && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) { clearTimeout(holdTimer); holdTimer = null; }
  if (!swipeEl) return;
  if (!swipeMode && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) swipeMode = Math.abs(dx) > Math.abs(dy) && dx < 0 ? 'x' : 'y';
  if (swipeMode !== 'x') return;
  swipeDx = Math.min(0, dx);
  if (!swipeBg) {
    swipeBg = document.createElement('div');
    swipeBg.className = 'swipe-bg';
    swipeBg.innerHTML = TRASH_ICON + '<span>Sil</span>';
    swipeEl.parentNode.insertBefore(swipeBg, swipeEl);
    swipeBg.style.top = swipeEl.offsetTop + 'px';
    swipeBg.style.height = swipeEl.offsetHeight + 'px';
  }
  const far = -swipeDx > swipeEl.offsetWidth * 0.35;
  swipeBg.classList.toggle('far', far);
  swipeEl.style.transition = 'none';
  swipeEl.style.transform = `translateX(${swipeDx}px)`;
}, { passive: true });
function endSwipe() {
  const el = swipeEl, bg = swipeBg;
  swipeEl = null; swipeBg = null;
  if (!el || swipeMode !== 'x') return false;
  held = true; // swallow the click that follows
  setTimeout(() => { held = false; }, 400);
  el.style.transition = 'transform .2s ease';
  if (-swipeDx > el.offsetWidth * 0.35) {
    el.style.transform = 'translateX(-110%)';
    setTimeout(() => askDelete(el.dataset.hold, !!el.closest('[data-today]')), 200);
  } else {
    el.style.transform = '';
    setTimeout(() => bg && bg.remove(), 200);
  }
  return true;
}
const endHold = e => {
  clearTimeout(holdTimer); holdTimer = null;
  endSwipe();
  if (held && e.cancelable) e.preventDefault();
};
app.addEventListener('touchend', endHold);
app.addEventListener('touchcancel', endHold);
app.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-hold]'), th = e.target.closest('[data-tophold]');
  e.preventDefault();
  if (th && !held) { clearTimeout(holdTimer); held = true; actions.hideTop(th.dataset.tophold); return; }
  if (el && !held && !state.sheet && !el.closest('[data-today]')) { clearTimeout(holdTimer); openHoldMenu(el); held = false; }
});

app.addEventListener('click', e => {
  if (held) { held = false; e.preventDefault(); return; }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = actions[el.dataset.a];
  if (fn) fn(el.dataset.v, e);
});
app.addEventListener('input', e => {
  if ((e.target.id === 'f_amount' || e.target.id === 'f_cost') && document.getElementById('f_profit')) {
    const a = parseAmount(val('f_amount')), c = parseAmount(val('f_cost'));
    document.getElementById('f_profit').textContent = c ? 'Qazanc: ' + money(a - c) : '';
  }
  if (e.target.id === 'dq' && state.sheet) {
    state.sheet.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = document.getElementById('dq'); if (q && q !== document.activeElement) { q.focus(); q.setSelectionRange(pos, pos); }
  }
  if (e.target.id === 'q') {
    state.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = document.getElementById('q'); if (q && q !== document.activeElement) { q.focus(); q.setSelectionRange(pos, pos); }
  }
});
// the two months chosen in "İki ayı müqayisə et"
function cmpPick(e) {
  if ((e.target.id !== 'cmpA' && e.target.id !== 'cmpB') || !state.sheet || state.sheet.kind !== 'compare') return;
  const k = e.target.id === 'cmpA' ? 'a' : 'b';
  if (state.sheet[k] !== e.target.value) { state.sheet[k] = e.target.value; render(); }
}
app.addEventListener('input', cmpPick);
app.addEventListener('change', cmpPick);
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && state.sheet) {
    const btn = app.querySelector('[data-a="saveTx"],[data-a="savePerson"]');
    if (btn) { e.preventDefault(); btn.click(); }
  }
});

load();
if (hasNative && Android.syncLinked) sync.account = Android.syncLinked();
if (hasNative && Android.pinSet && Android.pinSet() && Android.isLocked()) {
  state.pin = { mode: 'unlock', len: Android.pinLength(), entered: '', err: '' };
  if (bioOn()) setTimeout(() => Android.bioPrompt(), 300);
}
render();
updateShortcuts();
if (hasNative && Android.takeLaunchTarget) window.onLaunchTarget(Android.takeLaunchTarget());
runSync();
</script>
