name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Alətləri qur
        run: |
          # paket serveri bəzən ilişir: hər cəhd 4 dəqiqə ilə məhdud, 3 dəfə yoxlanır
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            if timeout 240 sudo apt-get $APT update -qq && timeout 240 sudo apt-get $APT install -y -qq openjdk-21-jdk-headless aapt apksigner dalvik-exchange zip zipalign; then break; fi
            [ $i = 3 ] && exit 1; echo "Təkrar cəhd $i"; sleep 10
          done
          curl -sSL -o /tmp/android.jar https://raw.githubusercontent.com/Sable/android-platforms/master/android-34/android.jar

      - name: Yığ və imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          AJAR=/tmp/android.jar
          # secret-lər telefondan kopyalananda gözəgörünməz simvol və boşluq düşə bilər: təmizlə
          # (parol yalnız ingilis hərfləri və rəqəmlərdir; base64 yalnız A-Z a-z 0-9 + / =)
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C tr -cd 'A-Za-z0-9')
          printf '%s' "$KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > /tmp/release.p12
          echo "Parol uzunluğu: ${#PW} (24 olmalıdır)"
          rm -rf build out && mkdir -p build/tools out
          javac -cp /usr/share/java/apksig.jar -d build/tools tools/Sign.java

          # $1 = kod qovluğu, $2 = APK adının başı, $3 = əlavə aapt parametrləri, $4 = proqramın adı (boşsa dəyişmir)
          # hər proqram yalnız öz release-i (r<versionCode>) hələ yoxdursa yığılır
          app() {
            local SRC="$1" PFX="$2" EXTRA="$3" LABEL="$4" W="build/$2"
            local C=$(grep -o 'versionCode="[0-9]*"' "$SRC/AndroidManifest.xml" | grep -o '[0-9]*')
            local V=$(grep -o 'versionName="[^"]*"' "$SRC/AndroidManifest.xml" | cut -d'"' -f2)
            if gh release view "r$C" >/dev/null 2>&1; then echo "$PFX: r$C artıq var, yığılmır"; return 0; fi
            rm -rf "$W" && mkdir -p "$W/gen" "$W/classes" "$W/dex" && cp -r "$SRC/res" "$W/res"
            cp "$SRC/AndroidManifest.xml" "$W/AndroidManifest.xml"
            if [ -n "$LABEL" ]; then
              sed -i 's/az\.usta\.hesab\.share/az.usta.hesabatim.share/' "$W/AndroidManifest.xml"
              sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">$LABEL</string>|" "$W/res/values/strings.xml"
            fi
            aapt package -f -M "$W/AndroidManifest.xml" -S "$W/res" -A "$SRC/assets" -I $AJAR $EXTRA --custom-package az.usta.hesab -J "$W/gen" -F "$W/u.apk"
            javac -Xlint:-options -source 8 -target 8 -bootclasspath $AJAR -d "$W/classes" $(find "$SRC/src" "$W/gen" -name "*.java")
            dalvik-exchange --dex --output="$W/dex/classes.dex" "$W/classes"
            (cd "$W/dex" && zip -q ../u.apk classes.dex)
            # Android 11+ quraşdırmır, əgər resources.arsc 4 bayta düzülməyibsə
            zipalign -f -p 4 "$W/u.apk" "$W/aligned.apk"
            local OUT="out/$PFX-$(echo "$V" | sed 's/ Rev\. */-Rev/; s/ /-/g').apk"
            java --add-exports java.base/sun.security.x509=ALL-UNNAMED --add-exports java.base/sun.security.pkcs=ALL-UNNAMED --add-exports java.base/sun.security.util=ALL-UNNAMED -cp /usr/share/java/apksig.jar:build/tools Sign /tmp/release.p12 "$PW" usta "$W/aligned.apk" "$OUT"
            zipalign -c -p 4 "$OUT"
            apksigner verify --print-certs "$OUT"
            aapt dump badging "$OUT" | head -1
            echo "$C|$V|$OUT" >> out/list.txt
          }

          # Akif Hesabat (Hesabatım, az.usta.hesabatim) — əsas qovluqdakı kod
          app . Hesabatim "--rename-manifest-package az.usta.hesabatim" "Hesabatım"
          # Emin Hesabat (Hesabat, az.usta.hesab) — emin/ qovluğundakı kod (3.1.3 Rev. 07)
          app emin Hesabat "" ""
          rm -f /tmp/release.p12
          touch out/list.txt

      - name: APK-nı yüklə
        uses: actions/upload-artifact@v4
        with:
          name: Hesabat-apk
          path: out/*.apk
          if-no-files-found: ignore

      # proqram açılanda buradan yeni versiyanı yoxlayır (tag: r<versionCode>)
      - name: Release (avtoyeniləmə üçün)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          git log -1 --format=%B > notes.txt
          # hər proqramın öz release-i: Hesabatim-*.apk yalnız Akif Hesabatı, Hesabat-*.apk yalnız Emin Hesabatı yeniləyir
          while IFS='|' read -r C V A; do
            [ -n "$C" ] || continue
            case "$A" in out/Hesabatim-*) T="Akif Hesabat $V";; *) T="Emin Hesabat $V";; esac
            gh release create "r$C" "$A" --title "$T" --notes-file notes.txt --latest
          done < out/list.txt
