name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # hesablamalar yoxlanır: biri səhv çıxsa, APK yığılmır və buraxılmır
      - name: Hesablamaları yoxla
        run: node emin/tests/calc.test.js

      - name: Alətləri qur
        run: |
          # Android SDK GitHub-ın öz maşınında hazır var: paket serverindən (apt) heç nə yüklənmir
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Build-tools: $BT"
          for t in aapt zipalign d8 apksigner; do [ -x "$BT/$t" ] || { echo "$t tapılmadı"; exit 1; }; done
          echo "$BT" >> "$GITHUB_PATH"
          echo "APKSIG=$BT/lib/apksigner.jar" >> "$GITHUB_ENV"
          if [ -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then cp "$ANDROID_HOME/platforms/android-34/android.jar" /tmp/android.jar
          else curl -sSL -o /tmp/android.jar https://raw.githubusercontent.com/Sable/android-platforms/master/android-34/android.jar; fi
          java -version 2>&1 | head -1

      - name: Yığ və imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          AJAR=/tmp/android.jar
          # secret-lər telefondan kopyalananda gözəgörünməz simvol və boşluq düşə bilər: təmizlə
          # (parol yalnız ingilis hərfləri və rəqəmlərdir; base64 yalnız A-Z a-z 0-9 + / =)
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C tr -cd 'A-Za-z0-9')
          printf '%s' "$KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > /tmp/release.p12
          echo "Parol uzunluğu: ${#PW} (24 olmalıdır)"
          rm -rf build out && mkdir -p build/tools out
          javac -cp "$APKSIG" -d build/tools tools/Sign.java

          # $1 = kod qovluğu, $2 = APK adının başı; yalnız öz release-i (r<versionCode>) hələ yoxdursa yığılır
          app() {
            local SRC="$1" PFX="$2" W="build/$2"
            local C=$(grep -o 'versionCode="[0-9]*"' "$SRC/AndroidManifest.xml" | grep -o '[0-9]*')
            local V=$(grep -o 'versionName="[^"]*"' "$SRC/AndroidManifest.xml" | cut -d'"' -f2)
            if gh release view "r$C" >/dev/null 2>&1; then echo "$PFX: r$C artıq var, yığılmır"; return 0; fi
            rm -rf "$W" && mkdir -p "$W/gen" "$W/classes" "$W/dex" && cp -r "$SRC/res" "$W/res"
            cp "$SRC/AndroidManifest.xml" "$W/AndroidManifest.xml"
            aapt package -f -M "$W/AndroidManifest.xml" -S "$W/res" -A "$SRC/assets" -I $AJAR --custom-package az.usta.hesab -J "$W/gen" -F "$W/u.apk"
            javac -Xlint:-options -source 8 -target 8 -bootclasspath $AJAR -d "$W/classes" $(find "$SRC/src" "$W/gen" -name "*.java")
            d8 --min-api 24 --lib $AJAR --output "$W/dex" $(find "$W/classes" -name "*.class")
            (cd "$W/dex" && zip -q ../u.apk classes.dex)
            # Android 11+ quraşdırmır, əgər resources.arsc 4 bayta düzülməyibsə
            zipalign -f -p 4 "$W/u.apk" "$W/aligned.apk"
            local OUT="out/$PFX-$(echo "$V" | sed 's/ Rev\.\? */-Rev/; s/ /-/g').apk"
            java --add-exports java.base/sun.security.x509=ALL-UNNAMED --add-exports java.base/sun.security.pkcs=ALL-UNNAMED --add-exports java.base/sun.security.util=ALL-UNNAMED -cp "$APKSIG":build/tools Sign /tmp/release.p12 "$PW" usta "$W/aligned.apk" "$OUT"
            zipalign -c -p 4 "$OUT"
            apksigner verify --print-certs "$OUT"
            aapt dump badging "$OUT" | head -1
            echo "$C|$V|$OUT" >> out/list.txt
          }

          # My Finance™ (az.usta.hesab) — emin/ qovluğundakı kod
          app emin Hesabat
          rm -f /tmp/release.p12
          touch out/list.txt

      - name: APK-nı yüklə
        uses: actions/upload-artifact@v4
        with:
          name: Hesabat-apk
          path: out/*.apk
          if-no-files-found: ignore

      # proqram açılanda buradan yeni versiyanı yoxlayır (tag: r<versionCode>)
      - name: Release (avtoyeniləmə üçün)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          git log -1 --format=%B > notes.txt
          # My Finance™ release-i (tag: r<versionCode>)
          while IFS='|' read -r C V A; do
            [ -n "$C" ] || continue
            T="My Finance™ $V"
            gh release create "r$C" "$A" --title "$T" --notes-file notes.txt --latest
          done < out/list.txt
