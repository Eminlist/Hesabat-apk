name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Alətləri qur
        run: |
          # paket serveri bəzən ilişir: hər cəhd 4 dəqiqə ilə məhdud, 3 dəfə yoxlanır
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            if timeout 240 sudo apt-get $APT update -qq && timeout 240 sudo apt-get $APT install -y -qq openjdk-21-jdk-headless aapt apksigner dalvik-exchange zip zipalign; then break; fi
            [ $i = 3 ] && exit 1; echo "Təkrar cəhd $i"; sleep 10
          done
          curl -sSL -o /tmp/android.jar https://raw.githubusercontent.com/Sable/android-platforms/master/android-34/android.jar

      - name: Yığ və imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eo pipefail
          AJAR=/tmp/android.jar
          # secret-lər telefondan kopyalananda gözəgörünməz simvol və boşluq düşə bilər: təmizlə
          # (parol yalnız ingilis hərfləri və rəqəmlərdir; base64 yalnız A-Z a-z 0-9 + / =)
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | LC_ALL=C tr -cd 'A-Za-z0-9')
          printf '%s' "$KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > /tmp/release.p12
          echo "Parol uzunluğu: ${#PW} (24 olmalıdır)"
          rm -rf build && mkdir -p build/gen build/classes build/dex build/tools
          aapt package -f -M AndroidManifest.xml -S res -A assets -I $AJAR -J build/gen -F build/unsigned.apk
          javac -Xlint:-options -source 8 -target 8 -bootclasspath $AJAR -d build/classes $(find src build/gen -name "*.java")
          dalvik-exchange --dex --output=build/dex/classes.dex build/classes
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          # Android 11+ quraşdırmır, əgər resources.arsc 4 bayta düzülməyibsə
          zipalign -f -p 4 build/unsigned.apk build/aligned.apk
          javac -cp /usr/share/java/apksig.jar -d build/tools tools/Sign.java
          java --add-exports java.base/sun.security.x509=ALL-UNNAMED --add-exports java.base/sun.security.pkcs=ALL-UNNAMED --add-exports java.base/sun.security.util=ALL-UNNAMED -cp /usr/share/java/apksig.jar:build/tools Sign /tmp/release.p12 "$PW" usta build/aligned.apk Hesabat.apk
          rm -f /tmp/release.p12
          zipalign -c -p 4 Hesabat.apk
          apksigner verify --print-certs Hesabat.apk
          V=$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)
          # "3.1.3 Rev. 00" -> Hesabat-3.1.3-Rev00.apk
          mv Hesabat.apk "Hesabat-$(echo "$V" | sed 's/ Rev\. */-Rev/; s/ /-/g').apk"

      - name: APK-nı yüklə
        uses: actions/upload-artifact@v4
        with:
          name: Hesabat-apk
          path: Hesabat-*.apk
