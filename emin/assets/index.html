<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Finance™</title>
<style>
  :root {
    --bg: #F4F7F9; --card: #FFFFFF; --text: #0F1A24; --muted: #6B7785; --line: #E7ECF0; --line2: #F0F3F6;
    --brand: #0E9384; --brand-2: #0B6B60; --brand-soft: #E2F4F1; --on-brand: #FFFFFF;
    --debt: #D9480F; --debt-soft: #FFF0E8; --pay: #16A34A; --pay-soft: #E8F7ED;
    --exp: #7C3AED; --exp-soft: #F1ECFE; --red: #DC2626; --red-soft: #FDECEC; --amber: #D97706; --amber-soft: #FEF3DC;
    --hero: linear-gradient(140deg, #14C7AF 0%, #0E9384 48%, #0A675C 100%);
    --hero-ink: #FFFFFF; --hero-sub: rgba(255,255,255,.82); --hero-chip: rgba(255,255,255,.16); --hero-line: rgba(255,255,255,.22);
    --btn: linear-gradient(140deg, #14B8A6, #0E9384 55%, #0B6B60); --btn-ink: #FFFFFF;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --shadow-hero: 0 14px 30px rgba(14,147,132,.28);
    --nav: rgba(255,255,255,.94); --shade: rgba(9,20,28,.42);
    --mist: none;
  }
  :root[data-theme="dark"] {
    --bg: #070708; --card: #121110; --text: #F4ECDC; --muted: #9F9584; --line: #26221B; --line2: #1B1914;
    --brand: #D9B45A; --brand-2: #A9832C; --brand-soft: #262011; --on-brand: #191306;
    --debt: #FF8A4C; --debt-soft: #2B1A10; --pay: #4ADE80; --pay-soft: #0F2417;
    --exp: #C4B5FD; --exp-soft: #1E1A2E; --red: #F87171; --red-soft: #2E1414; --amber: #F5C04E; --amber-soft: #2A2110;
    --hero: radial-gradient(120% 140% at 100% 0%, rgba(233,196,106,.30) 0%, rgba(233,196,106,0) 55%), linear-gradient(150deg, #2A2214 0%, #15110A 55%, #0B0906 100%);
    --hero-ink: #F7E3A6; --hero-sub: rgba(240,222,170,.72); --hero-chip: rgba(233,196,106,.12); --hero-line: rgba(233,196,106,.22);
    --btn: linear-gradient(140deg, #F4D88A 0%, #D9B45A 45%, #A9832C 100%); --btn-ink: #191306;
    --shadow: 0 1px 0 rgba(233,196,106,.06) inset, 0 10px 30px rgba(0,0,0,.45);
    --shadow-hero: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(233,196,106,.28) inset;
    --nav: rgba(14,13,11,.86); --shade: rgba(0,0,0,.62);
    --mist: radial-gradient(900px 520px at 85% -8%, rgba(217,180,90,.13), transparent 62%), radial-gradient(700px 520px at -12% 38%, rgba(255,240,210,.045), transparent 60%), radial-gradient(800px 600px at 60% 110%, rgba(217,180,90,.07), transparent 60%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.42 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; letter-spacing: .1px; }
  body::before { content: ''; position: fixed; inset: 0; background: var(--mist); pointer-events: none; z-index: 0; }
  #app { position: relative; z-index: 1; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--text); }
  .num { font-variant-numeric: tabular-nums; }
  svg { flex: none; }

  /* top bar: title on the left, settings on the right */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 16px 18px 6px; }
  .topbar h1 { margin: 0; flex: 1; font-size: 26px; font-weight: 800; letter-spacing: -.3px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .sub { display: block; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .3px; margin-bottom: 1px; }
  .tbtn { position: relative; width: 44px; height: 44px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--text); flex: none; }
  .tbtn:active { transform: scale(.94); }
  .tbtn svg { width: 22px; height: 22px; }
  :root[data-theme="dark"] .tbtn { border: 1px solid var(--line); color: var(--brand); }

  /* hero: the big gradient card */
  header, .hero { position: relative; margin: 10px 16px 6px; border-radius: 26px; padding: 18px; background: var(--hero); color: var(--hero-ink); box-shadow: var(--shadow-hero); overflow: hidden; }
  header::after, .hero::after { content: ''; position: absolute; right: -60px; top: -70px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.08); pointer-events: none; }
  :root[data-theme="dark"] header::after, :root[data-theme="dark"] .hero::after { background: radial-gradient(circle, rgba(233,196,106,.16), transparent 70%); }
  .stats { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--hero-chip); border-radius: 16px; padding: 11px 12px; color: var(--hero-ink); text-align: left; }
  .stat small { display: block; color: var(--hero-sub); font-size: 12px; font-weight: 600; }
  .stat b { font-size: 19px; font-weight: 800; letter-spacing: -.2px; }
  button.stat { display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; }
  button.stat:active { filter: brightness(1.08); }
  .hchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--hero-line); background: var(--hero-chip); color: var(--hero-ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
  .heye { width: 40px; height: 40px; border-radius: 50%; background: var(--hero-chip); color: var(--hero-ink); display: grid; place-items: center; }
  .heye svg { width: 20px; height: 20px; }
  .hbal { position: relative; z-index: 1; text-align: center; padding: 6px 0 14px; }
  .hbal small { display: block; color: var(--hero-sub); font-size: 14px; font-weight: 600; }
  .hbal b { display: block; font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1.15; margin-top: 4px; }
  :root[data-theme="dark"] .hbal b, :root[data-theme="dark"] .bal b { background: linear-gradient(180deg, #FFF1C9 0%, #E9C46A 55%, #B88A2E 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hbal .neg-hero { color: #FFE1DC !important; -webkit-text-fill-color: #FFE1DC; background: none !important; }
  .hsplit { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1px 1fr; gap: 12px; align-items: center; border-top: 1px solid var(--hero-line); padding-top: 14px; }
  .hsplit .sep { background: var(--hero-line); height: 34px; }
  .hio { display: flex; gap: 10px; align-items: center; text-align: left; color: var(--hero-ink); min-width: 0; }
  .hio i { width: 34px; height: 34px; border-radius: 50%; background: var(--hero-chip); display: grid; place-items: center; font-style: normal; flex: none; }
  .hio i svg { width: 18px; height: 18px; }
  .hio small { display: block; color: var(--hero-sub); font-size: 12px; font-weight: 600; }
  .hio b { display: block; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hrow { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

  main { padding: 12px 16px 130px; }
  .search { width: 100%; padding: 13px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); margin-bottom: 12px; box-shadow: var(--shadow); outline: none; }
  .search:focus { border-color: var(--brand); }
  .list { position: relative; background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
  :root[data-theme="dark"] .list, :root[data-theme="dark"] .card, :root[data-theme="dark"] .hm-card, :root[data-theme="dark"] .hm-mini, :root[data-theme="dark"] .tile, :root[data-theme="dark"] .addopt { border: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line2); width: 100%; text-align: left; color: var(--text); }
  .row:last-child { border-bottom: 0; }
  .row:active { background: var(--line2); }
  .avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; flex: none; font-size: 15px; }
  .grow { flex: 1; min-width: 0; }
  .grow .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt { font-weight: 750; text-align: right; white-space: nowrap; }
  .amt small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
  .debt { color: var(--debt); } .pay { color: var(--pay); } .exp { color: var(--exp); } .zero { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; margin: 20px 4px 9px; font-weight: 700; }
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 2px 10px; }
  .sec b { font-size: 19px; font-weight: 800; letter-spacing: -.2px; }
  .sec a, .sec button { color: var(--brand); font-weight: 700; font-size: 14px; text-decoration: none; }

  .addlist { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .addopt { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; width: 100%; text-align: left; padding: 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); color: var(--text); }
  .addopt:active { transform: scale(.98); }
  .addopt .addic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
  .addopt .addic svg { width: 23px; height: 23px; }
  .addopt b { display: block; font-size: 15px; }
  .addopt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.3; }
  .addopt .chev { display: none; }
  .fab { position: fixed; right: 16px; bottom: 96px; background: var(--btn); color: var(--btn-ink); border-radius: 999px; padding: 11px 18px; font-size: 14px; font-weight: 750; box-shadow: var(--shadow-hero); z-index: 5; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: flex-end; background: var(--nav); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-radius: 26px 26px 0 0; box-shadow: 0 -6px 26px rgba(16,24,40,.08); padding-bottom: env(safe-area-inset-bottom); }
  :root[data-theme="dark"] nav { border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgba(0,0,0,.6); }
  nav button { flex: 1; padding: 12px 0 13px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; }
  nav button svg { width: 23px; height: 23px; }
  nav button.on { color: var(--brand); font-weight: 800; }
  nav .navplus { flex: none; width: 74px; padding: 0; align-self: center; }
  nav .navplus span { width: 60px; height: 60px; border-radius: 50%; margin: -30px auto 8px; display: grid; place-items: center; background: var(--btn); color: var(--btn-ink); box-shadow: var(--shadow-hero); border: 5px solid var(--bg); }
  nav .navplus svg { width: 28px; height: 28px; }
  nav .navplus:active span { transform: scale(.93); }

  .card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); color: var(--text); }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .kv:last-child { border-bottom: 0; }
  .kv.total { font-weight: 800; font-size: 17px; }
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .monthbar b { font-size: 17px; font-weight: 800; }
  .iconbtn { width: 42px; height: 42px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 20px; color: var(--text); }

  .btn { display: block; width: 100%; padding: 14px; border-radius: 16px; font-weight: 750; text-align: center; margin-top: 10px; color: var(--text); }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: var(--btn); color: var(--btn-ink); box-shadow: 0 6px 16px rgba(14,147,132,.22); }
  :root[data-theme="dark"] .btn.primary { box-shadow: 0 6px 18px rgba(217,180,90,.18); }
  .btn.ghost { background: var(--card); box-shadow: var(--shadow); }
  :root[data-theme="dark"] .btn.ghost { border: 1px solid var(--line); }
  .btn.danger { background: var(--red-soft); color: var(--red); }
  .btn.debtb { background: var(--debt); color: #fff; }
  .btn.payb { background: var(--pay); color: #fff; }
  :root[data-theme="dark"] .btn.payb { color: #052E14; }
  :root[data-theme="dark"] .btn.debtb { color: #2B1206; }
  .btn.expb { background: var(--exp); color: #fff; }
  :root[data-theme="dark"] .btn.expb { color: #1A1235; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two .btn { margin-top: 0; }
  .note { font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .badge.ok { background: var(--pay-soft); color: var(--pay); }

  /* full-screen pages */
  .page { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10; padding-bottom: 30px; }
  .page::before { content: ''; position: fixed; inset: 0; background: var(--mist); pointer-events: none; }
  .page > * { position: relative; }
  .page > header { display: flex; align-items: center; gap: 12px; margin: 0; padding: 16px 18px 6px; background: none; box-shadow: none; border-radius: 0; color: var(--text); overflow: visible; }
  .page > header::after { display: none; }
  .page > header h1 { margin: 0; flex: 1; font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page > header button { width: 44px; height: 44px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); color: var(--text); font-size: 20px; display: grid; place-items: center; flex: none; }
  :root[data-theme="dark"] .page > header button { border: 1px solid var(--line); color: var(--brand); }
  .page > header button svg { width: 22px; height: 22px; }
  .bal { position: relative; z-index: 1; text-align: center; padding: 4px 0 2px; }
  .bal small { color: var(--hero-sub); font-weight: 600; }
  .bal b { display: block; font-size: 34px; font-weight: 800; letter-spacing: -.6px; }
  .hero a { color: var(--hero-ink); }

  .shade { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: flex; align-items: flex-end; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .sheet { position: relative; background: var(--bg); width: 100%; border-radius: 28px 28px 0 0; padding: 26px 16px 22px; max-height: 92vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
  .sheet::before { content: ''; position: absolute; left: 50%; top: 9px; width: 42px; height: 5px; margin-left: -21px; border-radius: 3px; background: var(--line); }
  :root[data-theme="dark"] .sheet { background: #0D0C0A; border-top: 1px solid rgba(233,196,106,.22); }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; font-weight: 800; letter-spacing: -.2px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
  .field { width: 100%; padding: 13px 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color-scheme: light dark; outline: none; }
  :root[data-theme="dark"] .field { color-scheme: dark; }
  .field.big { font-size: 26px; font-weight: 800; }
  .field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .seg { display: flex; background: var(--line2); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; padding: 10px; border-radius: 11px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: var(--btn); color: var(--btn-ink); }
  .seg button.on.debt { background: var(--debt); color: #fff; }
  .seg button.on.pay { background: var(--pay); color: #fff; }
  :root[data-theme="dark"] .seg button.on.pay { color: #052E14; }
  .del { color: var(--muted); font-size: 18px; width: 32px; height: 32px; border-radius: 10px; flex: none; }
  .dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 16px 4px 7px; font-size: 13px; color: var(--muted); }
  .dayhead b { color: var(--text); font-weight: 700; }
  .dayhead .num span { margin-left: 8px; font-weight: 750; }
  .mini { flex: none; padding: 8px 13px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); font-weight: 750; font-size: 13px; }
  [data-hold] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  [data-hold] { background: var(--card); position: relative; z-index: 1; touch-action: pan-y; }
  .swipe-bg { position: absolute; left: 0; right: 0; background: var(--amber); color: #fff; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding-right: 20px; font-weight: 750; z-index: 0; transition: background .15s; }
  .swipe-bg.far { background: var(--red); }

  .pinpage { position: fixed; inset: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; z-index: 50; text-align: center; }
  .pinpage::before { content: ''; position: fixed; inset: 0; background: var(--mist); pointer-events: none; }
  .pinpage > * { position: relative; }
  .pinpage .logo { width: 84px; height: 84px; border-radius: 24px; box-shadow: var(--shadow-hero); }
  .pinpage h1 { margin: 16px 0 2px; font-size: 24px; font-weight: 800; }
  .pinpage h2 { margin: 0 0 6px; font-size: 15px; font-weight: 500; color: var(--muted); }
  .pinpage .seg { background: var(--card); }
  .pinpage .seg button { color: var(--text); }
  .pinpage .seg button.on.pay { background: var(--btn); color: var(--btn-ink); }
  .dots { display: flex; gap: 14px; justify-content: center; margin: 20px 0 6px; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--brand); }
  .dots i.on { background: var(--brand); }
  .pinerr { min-height: 20px; font-size: 14px; color: var(--red); margin-bottom: 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 28px; }
  .pad button { width: 76px; height: 76px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); color: var(--text); font-size: 28px; font-weight: 600; display: grid; place-items: center; }
  .pad button:active { background: var(--brand-soft); }
  .pad button.ic { background: none; box-shadow: none; color: var(--brand); }
  .pinlink { margin-top: 24px; color: var(--brand); font-weight: 700; font-size: 15px; }

  /* smooth entry */
  @keyframes pageIn { from { transform: translateX(36px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes tabIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shadeIn { from { background: transparent; } }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
  #app[data-anim="page"] .page { animation: pageIn .24s ease-out; }
  #app[data-anim="back"] main, #app[data-anim="tab"] main { animation: tabIn .22s ease-out; }
  #app[data-sheet-anim="1"] .shade { animation: shadeIn .22s ease-out; }
  #app[data-sheet-anim="1"] .sheet { animation: sheetIn .28s cubic-bezier(.2,.8,.3,1); }
  @media (prefers-reduced-motion: reduce) { #app * { animation: none !important; } }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .tplbox { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 4px; box-shadow: var(--shadow); }
  .tplbox a { color: var(--brand); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px; font-size: 14px; font-weight: 650; color: var(--text); }
  .chip:active { background: var(--brand-soft); }
  .chip.on { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
  .hidden { display: none !important; }
  .section-title[data-a^=toggle] { background: var(--card) !important; box-shadow: var(--shadow); border-left: 5px solid currentColor !important; border-radius: 18px; padding: 16px 14px !important; width: 100% !important; margin: 10px 0 !important; font-size: 15px; text-transform: none; letter-spacing: 0; }
  .section-title[data-a^=toggle] span:first-child { color: var(--text); }
  .section-title[data-a^=toggle] .num { font-size: 17px; font-weight: 800; }
  .neg { color: var(--red) !important; font-weight: 800; }
  header .neg, .hero .neg { color: #fff !important; background: rgba(220,38,38,.9); border-radius: 8px; padding: 0 6px; -webkit-text-fill-color: #fff; }
  .calcbar { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .calcbar button { min-width: 46px; padding: 8px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 19px; font-weight: 800; color: var(--brand); }
  .calcres { margin-left: auto; font-weight: 750; color: var(--muted); }
  .dash { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--card); border-radius: 18px; padding: 13px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-height: 84px; color: var(--text); box-shadow: var(--shadow); }
  .tile:active { transform: scale(.98); }
  .tile small { color: var(--muted); font-size: 12px; font-weight: 700; }
  .tile b { font-size: 18px; }
